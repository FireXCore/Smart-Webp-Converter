name: WordPress plugin checks and package

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, imagick, mbstring
          coverage: none
      - name: PHP lint
        run: |
          find smart-webp-converter tests -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Smoke tests
        run: php tests/smoke.php

  wordpress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wp: ['6.7.10', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: swc_test
          MYSQL_ROOT_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, imagick, mbstring, mysqli
          coverage: none
      - name: Install WordPress CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o wp-cli.phar
          php wp-cli.phar --info
      - name: Install real WordPress
        env:
          WP_VERSION: ${{ matrix.wp }}
        run: |
          mkdir -p "$RUNNER_TEMP/swc-wordpress"
          php wp-cli.phar core download --path="$RUNNER_TEMP/swc-wordpress" --version="$WP_VERSION"
          php wp-cli.phar config create --path="$RUNNER_TEMP/swc-wordpress" --dbname=swc_test --dbuser=root --dbpass=test-password --dbhost=127.0.0.1:3306
          php wp-cli.phar core install --path="$RUNNER_TEMP/swc-wordpress" --url=http://localhost --title="SWC Test" --admin_user=admin --admin_password=local-test-only --admin_email=test@example.com --skip-email
          cp -a smart-webp-converter "$RUNNER_TEMP/swc-wordpress/wp-content/plugins/"
          php wp-cli.phar plugin activate smart-webp-converter --path="$RUNNER_TEMP/swc-wordpress"
      - name: Real WordPress image integration
        run: php wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/wp-integration.php" --path="$RUNNER_TEMP/swc-wordpress"

  package:
    needs: [php, wordpress]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build installable plugin ZIP
        run: |
          zip -q -r smart-webp-converter-1.2.0.zip smart-webp-converter
          unzip -l smart-webp-converter-1.2.0.zip
      - uses: actions/upload-artifact@v4
        with:
          name: smart-webp-converter-1.2.0
          path: smart-webp-converter-1.2.0.zip
          if-no-files-found: error
