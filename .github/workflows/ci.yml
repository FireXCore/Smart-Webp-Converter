name: WordPress plugin checks and package

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, imagick, mbstring
          coverage: none
      - name: PHP lint
        run: |
          find smart-webp-converter tests -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Smoke tests
        run: php tests/smoke.php

  wordpress:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wp: ['6.7.10', 'latest']
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: swc_test
          MYSQL_ROOT_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-password"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: gd, imagick, mbstring, mysqli
          coverage: none
      - name: Install WordPress CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o wp-cli.phar
          php wp-cli.phar --info
      - name: Install real WordPress
        env:
          WP_VERSION: ${{ matrix.wp }}
        run: |
          mkdir -p "$RUNNER_TEMP/swc-wordpress"
          php wp-cli.phar core download --path="$RUNNER_TEMP/swc-wordpress" --version="$WP_VERSION"
          php wp-cli.phar config create --path="$RUNNER_TEMP/swc-wordpress" --dbname=swc_test --dbuser=root --dbpass=test-password --dbhost=127.0.0.1:3306
          php wp-cli.phar core install --path="$RUNNER_TEMP/swc-wordpress" --url=http://localhost --title="SWC Test" --admin_user=admin --admin_password=local-test-only --admin_email=test@example.com --skip-email
          cp -a smart-webp-converter "$RUNNER_TEMP/swc-wordpress/wp-content/plugins/"
          php wp-cli.phar plugin activate smart-webp-converter --path="$RUNNER_TEMP/swc-wordpress"
      - name: Real WordPress image integration
        run: php wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/wp-integration.php" --path="$RUNNER_TEMP/swc-wordpress" --user=admin
      - name: Upgrade existing WordPress.org 1.1.0 installation
        if: matrix.wp == 'latest'
        run: |
          set -euo pipefail
          wpdir="$RUNNER_TEMP/swc-wordpress"
          php wp-cli.phar plugin deactivate smart-webp-converter --path="$wpdir"
          php wp-cli.phar plugin delete smart-webp-converter --path="$wpdir"
          php wp-cli.phar plugin install smart-webp-converter --version=1.1.0 --activate --path="$wpdir"
          php wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/wp-upgrade-fixture.php" seed --path="$wpdir"
          php wp-cli.phar plugin deactivate smart-webp-converter --path="$wpdir"
          php wp-cli.phar plugin delete smart-webp-converter --path="$wpdir"
          cp -a smart-webp-converter "$wpdir/wp-content/plugins/"
          php wp-cli.phar plugin activate smart-webp-converter --path="$wpdir"
          php wp-cli.phar eval-file "$GITHUB_WORKSPACE/tests/wp-upgrade-fixture.php" verify --path="$wpdir"
      - name: WordPress.org Plugin Check diagnostic
        if: matrix.wp == 'latest'
        run: |
          php wp-cli.phar plugin install plugin-check --activate --path="$RUNNER_TEMP/swc-wordpress"
          set +e
          php wp-cli.phar plugin check smart-webp-converter --format=json --path="$RUNNER_TEMP/swc-wordpress" --require="$RUNNER_TEMP/swc-wordpress/wp-content/plugins/plugin-check/cli.php" > plugin-check-results.txt 2>&1
          status=$?
          set -e
          echo "Plugin Check exit code: $status"
          head -c 20000 plugin-check-results.txt
          test -s plugin-check-results.txt
      - name: Capture real WordPress admin screenshots
        if: matrix.wp == 'latest'
        run: |
          set -euo pipefail
          wpdir="$RUNNER_TEMP/swc-wordpress"
          php wp-cli.phar option update home http://127.0.0.1:8765 --path="$wpdir"
          php wp-cli.phar option update siteurl http://127.0.0.1:8765 --path="$wpdir"
          php -S 127.0.0.1:8765 -t "$wpdir" > "$RUNNER_TEMP/web-server.log" 2>&1 &
          for i in {1..30}; do
            if curl --fail --silent --output /dev/null http://127.0.0.1:8765/wp-login.php; then break; fi
            sleep 1
          done
          npm install --no-save playwright
          npx playwright install chromium
          SWC_SCREENSHOT_DIR="$GITHUB_WORKSPACE/wporg-screenshots" node tests/capture-admin.mjs
          test -s wporg-screenshots/screenshot-1.png
          test -s wporg-screenshots/screenshot-2.png
      - uses: actions/upload-artifact@v4
        if: matrix.wp == 'latest'
        with:
          name: wporg-real-screenshots
          path: wporg-screenshots/screenshot-*.png
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.wp == 'latest'
        with:
          name: wordpress-plugin-check
          path: plugin-check-results.txt
          if-no-files-found: error

  package:
    needs: [php, wordpress]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install asset renderer
        run: python3 -m pip install --break-system-packages cairosvg pillow
      - name: Download authenticated WordPress screenshots
        uses: actions/download-artifact@v4
        with:
          name: wporg-real-screenshots
          path: wporg-svn/assets
      - name: Build branded WordPress.org SVN assets
        run: python3 artwork/render_assets.py --output wporg-svn/assets
      - name: Build installable plugin ZIP and complete SVN package
        run: |
          set -euo pipefail
          grep -Fq 'Version: 1.2.1' smart-webp-converter/smart-webp-converter.php
          grep -Fq 'Stable tag: 1.2.1' smart-webp-converter/readme.txt
          zip -qr smart-webp-converter-1.2.1.zip smart-webp-converter
          mkdir -p wporg-svn/trunk
          cp -a smart-webp-converter/. wporg-svn/trunk/
          test -s wporg-svn/assets/screenshot-1.png
          test -s wporg-svn/assets/screenshot-2.png
          (cd wporg-svn && zip -qr ../smart-webp-converter-1.2.1-SVN.zip trunk assets)
          unzip -t smart-webp-converter-1.2.1.zip
          unzip -t smart-webp-converter-1.2.1-SVN.zip
          sha256sum smart-webp-converter-1.2.1*.zip > SHA256SUMS
          ls -lh *.zip SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: smart-webp-converter-1.2.1-complete
          path: |
            smart-webp-converter-1.2.1.zip
            smart-webp-converter-1.2.1-SVN.zip
            SHA256SUMS
          if-no-files-found: error
